.brand{display:flex;gap:10px;align-items:center;max-width:860px;margin:auto}

input,select,textarea{font:inherit;width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);font-size:15px}

.exc{border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:10px;background:#fff}.exc.on{background:#f0f6ff;border-color:var(--acc)}
.sets{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin-top:8px}.setw{margin:0;display:flex;flex-direction:column;gap:2px;font-size:12px;color:var(--muted)}.setw input{padding:8px}

</style>

function assignProg(id,key,pid){const c=C(id);if(!c)return;const base=P(pid);

  if(base.type==="workout")cp.sections=cp.sections.map(sec=>({title:sec.title,ex:exOf(sec).map(e=>Object.assign({n:"",s:"",r:"",v:""},e))}));
  S.programs.push(cp);c[key]=cp.id;if(key==="workoutId"){c.nextDay=0}
  if(old&&old.owner===id&&!S.clients.some(x=>x.id!==id&&(x.workoutId===old.id||x.dietId===old.id)))S.programs=S.programs.filter(x=>x.id!==old.id);

    [["name",0],["title",1],["city",2]].forEach(([k,i])=>{const[a,e]=sw[i];if(S.lang==="en"&&p[k]===a)p[k]=e;if(S.lang==="ar"&&p[k]===e)p[k]=a});
    applyLang();closeModal();save()},
  giftSeen(){S.giftSeen=true;save()},
  newClient(){clientForm()},
  editClient(id){clientForm(C(id))},
  openClient(id){openClient(id)},
  delClient(id,el){sure(el,()=>{const c=C(id);(c.files||[]).forEach(f=>delFile(f.id));PHOTO_KEYS().forEach(([k])=>delFile((c.photos||{})[k]));S.clients=S.clients.filter(c=>c.id!==id);S.sessions=S.sessions.filter(s=>s.clientId!==id);S.payments=S.payments.filter(p=>p.clientId!==id);closeModal();save();toast(T("اتحذف","Deleted"))})},
  renew(id){renewForm(id)},
  goalF(k){goalF=k;render()},
  newSession(id){sessionForm(id)},
  toggleSession(id){const s=S.sessions.find(x=>x.id===id);if(s){s.done=!s.done;save()}},
  delSession(id){S.sessions=S.sessions.filter(s=>s.id!==id);save();toast(T("الحصة اتشالت","Session removed"))},
  pickDay(d){selDay=d;render()},
  shiftDay(n){selDay=addDays(selDay,+n);render()},
  progType(t){progType=t;render()},
  newProgram(){programForm()},
  editProgram(id){programForm(JSON.parse(JSON.stringify(P(id))))},
  viewProgram(id){viewProgram(id)},
  dupProgram(id){const p=JSON.parse(JSON.stringify(P(id)));p.id=uid();p.name+=T(" (نسخة)"," (copy)");S.programs.push(p);save();programForm(p)},
  delProgram(id,el){sure(el,()=>{S.programs=S.programs.filter(p=>p.id!==id);S.clients.forEach(c=>{if(c.workoutId===id)c.workoutId="";if(c.dietId===id)c.dietId=""});closeModal();save();toast(T("اتحذف","Deleted"))})},
  templates(){openModal(`${head(T("قوالب جاهزة","Templates"))}<p class="muted">${T("اختار قالب وعدّل عليه براحتك.","Pick a template and edit it as you like.")}</p><div class="list">${TEMPLATES.map((t,i)=>{t=t[LANG];return `<div class="item click" data-act="useTpl" data-id="${i}"><div class="av">${t.type==="diet"?"🥗":"🏋️"}</div><div class="grow"><b>${t.name}</b><small>${t.sections.map(s=>s.title).join(" · ")}</small></div></div>`}).join("")}</div>`)},
  useTpl(i){const t=JSON.parse(JSON.stringify(TEMPLATES[+i][LANG]));progType=t.type;render();programForm(t)},
  addSec(){const isDiet=$("#sheet select[name=type]").value==="diet";$("#secs").insertAdjacentHTML("beforeend",secBlock({title:"",lines:"",ex:[{n:"",s:"",r:"",v:""}]},isDiet));$("#secs").lastElementChild.querySelector("input").focus()},
  addEx(_,el){const box=el.closest(".sec").querySelector(".exs");box.insertAdjacentHTML("beforeend",exRow({n:"",s:"",r:"",v:""}));box.lastElementChild.querySelector("input").focus()},
  delEx(_,el){const box=el.closest(".exs");if(box.querySelectorAll(".exr").length>1)el.closest(".exr").remove();else el.closest(".exr").querySelectorAll("input").forEach(i=>i.value="")},
  delSec(_,el){if(document.querySelectorAll("#secs .sec").length>1)el.closest(".sec").remove();else toast(T("لازم يفضل جزء واحد على الأقل","Keep at least one section"))},
  copyProg(id){copy(programText(P(id)))},
  newPay(id){payForm(id)},
  delPay(id){S.payments=S.payments.filter(p=>p.id!==id);save();toast(T("الدفعة اتشالت","Payment removed"))},
  month(m){selMonth=m;render()},
  editProfile(){profileForm()},
  copyCard(){copy(cardText())},
  backup(){copy(JSON.stringify(S))},
  restore(){openModal(`${head(T("رجّع من نسخة احتياطية","Restore from backup"))}<form data-form="restore"><p class="muted">${T("الصق النسخة هنا. البيانات الحالية هتتبدل بيها.","Paste the backup here. Current data will be replaced.")}</p><textarea name="data" required style="min-height:180px;direction:ltr"></textarea>${formBtns(T("رجّع","Restore"))}</form>`)},
  openTrainee(id){trainee=id;tDay=0;tDone={};closeModal();render();scrollTo(0,0)},
  exitTrainee(){const id=trainee;trainee=null;render();openClient(id)},
  tDay(i){tDay=+i;render()},
  tStart(){const c=curClient(),w=c&&P(c.workoutId);if(!w)return;const n=w.sections.length;
    c.cur={date:today(),time:nowHM(),day:(+c.nextDay||0)%n,w:{},done:{},by:ME.role==="coach"?"coach":"self"};c.cu=Date.now();save();toast(T("الحصة بدأت 💪","Session started 💪"))},
  tEx(i){const c=curClient();if(!c||!c.cur)return;c.cur.done=c.cur.done||{};c.cur.done[i]=!c.cur.done[i];
    const w=P(c.workoutId),ex=w?exOf(w.sections[Math.min(c.cur.day,w.sections.length-1)]):[];
    if(ex.length&&ex.every((_,k)=>c.cur.done[k])){finishSession(c);save();toast(T("عاش يا بطل! الحصة اتسجلت إنها تمت 🔥","Great job! Session saved as done 🔥"));scrollTo(0,0);return}
    save()},
  tCancel(_,el){sure(el,()=>{const c=curClient();if(c){c.cur=null;c.cu=Date.now();save()}})},
  video(u){ytModal(u)},
  askEdit(){openModal(`${head(T("طلب تعديل البيانات","Request a change"))}<form data-form="editReq"><p class="muted">${T("اكتب للكابتن عايز تعدّل إيه، وهو هيعدّله أو يفتحلك التعديل.","Tell your coach what you want to change — they'll update it or unlock editing for you.")}</p><textarea name="t" required placeholder="${T("مثلاً: وزني بقى ٨٥، وبقيت أقدر أتمرن ٤ أيام","e.g. my weight is now 85 and I can train 4 days")}"></textarea>${formBtns(T("ابعت الطلب","Send request"))}</form>`)},
  startSession(id){const c=C(id);if(!c)return;if(!P(c.workoutId))return toast(T("اختار برنامج تمارين للمتدرب الأول","Assign a workout program first"));trainee=id;closeModal();
    if(!c.cur||!c.cur.date){const n=P(c.workoutId).sections.length;c.cur={date:today(),time:nowHM(),day:(+c.nextDay||0)%n,w:{},done:{},by:"coach"};c.cu=Date.now();save();toast(T("الحصة بدأت 💪","Session started 💪"))}else render();scrollTo(0,0)},
  openLog(k){const [cid,lid]=k.split("|");logView(C(cid),lid)},
  openEdit(id){const c=C(id);if(!c)return;c.editOpen=true;c.editReq=null;save();openClient(id);toast(T("اتفتحله التعديل ✓","Editing unlocked ✓"))},
  lockEdit(id){const c=C(id);if(!c)return;c.editOpen=false;save();openClient(id)},
  ignoreEdit(id){const c=C(id);if(!c)return;c.editReq=null;save();openClient(id)},
  coachEdit(id){const c=C(id);if(!c)return;c.editReq=null;save();clientForm(c)},
  pickProg(k){const [id,key]=k.split("|");assignProg(id,key,document.querySelector(`select[data-key="${key}"]`).value)}
};
const FORMS={
  client(f,id){
    const v=k=>(f.get(k)||"").toString().trim(),cm=ME.role==="client";
    const med={};const Q=QS();[...Q.med,...Q.food,...Q.life].forEach(x=>{if(x.women&&v("gender")!=="f")return;med[x.k]=readQ(x,v)});
    const data={med,days:{a:v("q_days"),t:v("q_days")==="other"?v("q_days_t"):""},name:v("name"),phone:v("phone"),gender:v("gender"),dob:(v("dob_y")&&v("dob_m")&&v("dob_d"))?`${v("dob_y")}-${v("dob_m")}-${v("dob_d")}`:"",country:v("country")==="__other"?v("country_t"):v("country"),job:v("job"),goalText:v("goalText"),goal:v("goal"),mode:v("mode"),height:v("height"),notes:v("notes")};
    if(!cm)Object.assign(data,{subStart:v("subStart"),subEnd:v("subEnd"),price:v("price")});
    let c=cm?S.clients[0]:C(id),isNew=!c;
    if(c)Object.assign(c,data);else{c=Object.assign({id:id||uid(),weights:[],workoutId:"",dietId:"",status:"active"},data);S.clients.push(c)}
    if(v("weight")){const t=today();c.weights=(c.weights||[]).filter(x=>x.date!==t);c.weights.push({date:t,w:+v("weight")})}
    const mm={};MEAS().forEach(([k])=>{if(v("m_"+k))mm[k]=+v("m_"+k)});
    if(Object.keys(mm).length){const t=today();c.measures=(c.measures||[]).filter(x=>x.date!==t);c.measures.push(Object.assign({date:t},mm))}
    if(f.get("consent")&&!c.consent)c.consent=today();
    if(cm&&c.editOpen){c.editOpen=false;c.editReq=null}
    if(!cm&&isNew&&f.get("paid")&&+data.price)S.payments.push({id:uid(),clientId:c.id,amount:+data.price,date:today(),note:T("اشتراك","Subscription")});
    const keep=formFiles.map(x=>x.id);(c.files||[]).filter(x=>!keep.includes(x.id)).forEach(x=>delFile(x.id));
    c.files=formFiles.map(x=>({id:x.id,kind:x.kind,date:x.date}));
    const op=c.photos||{};PHOTO_KEYS().forEach(([k])=>{if(op[k]&&op[k]!==formPhotos[k])delFile(op[k])});
    c.photos=Object.assign({},formPhotos);c.cu=Date.now();
    formFiles=[];formC=null;formPhotos={};save();scrollTo(0,0);
    if(cm){toast(T("بياناتك اتبعتت للكابتن ✓","Your details were sent to your coach ✓"));return}
    openClient(c.id);toast(isNew?T("العميل اتضاف ✓","Client added ✓"):T("اتحفظ ✓","Saved ✓"));
  },
  async auth(f){const v=k=>(f.get(k)||"").toString().trim(),reg=authMode==="register";authError="";
    if(reg&&v("password")!==v("password2")){authError=T("الباسوردين مش زي بعض","Passwords don't match");return render()}
    const btn=$("form[data-form=auth] button");if(btn){btn.disabled=true;btn.textContent=T("لحظة…","One moment…")}
    try{if(reg){const r=await FB.auth.createUserWithEmailAndPassword(v("email"),v("password"));await r.user.updateProfile({displayName:v("name")})}else await FB.auth.signInWithEmailAndPassword(v("email"),v("password"))}
    catch(e){authError=authMsg(e);render()}},
  weight(f,id){logW(id,f.get("w"));openClient(id)},
  editReq(f){const c=S.clients[0];if(!c)return;c.editReq={t:(f.get("t")||"").toString().trim(),date:today()};c.cu=Date.now();closeModal();save();toast(T("الطلب اتبعت للكابتن ✓","Request sent to your coach ✓"))},
  checkin(f,id){const c=ME.role==="coach"?C(id):S.clients[0];if(!c)return;const t=today(),v=k=>(f.get(k)||"").toString().trim();
    if(v("weight")){c.weights=(c.weights||[]).filter(x=>x.date!==t);c.weights.push({date:t,w:+v("weight")})}
    const mm={date:t};MEAS().forEach(([k])=>{if(v("m_"+k))mm[k]=+v("m_"+k)});c.measures=(c.measures||[]).filter(x=>x.date!==t);c.measures.push(mm);c.cu=Date.now();save();toast(T("التحديث اتسجل ✓","Check-in saved ✓"))},
  tWeight(f,id){logW(id,f.get("w"))},
  renew(f,id){const c=C(id),mo=+f.get("months");const start=c.subEnd&&daysLeft(c.subEnd)>=0?addDays(c.subEnd,1):today();
    const d=new Date(start+"T00:00");d.setMonth(d.getMonth()+mo);c.subStart=start;c.subEnd=addDays(fmt(d),-1);
    if(+f.get("price"))c.price=f.get("price");
    if(f.get("paid")&&+f.get("price"))S.payments.push({id:uid(),clientId:id,amount:+f.get("price"),date:today(),note:T("تجديد","Renewal")});
    save();openClient(id);toast(T("الاشتراك اتجدد ✓","Renewed ✓"))},
  session(f){const n=+f.get("repeat");for(let i=0;i<n;i++)S.sessions.push({id:uid(),clientId:f.get("clientId"),date:addDays(f.get("date"),i*7),time:f.get("time"),note:(f.get("note")||"").trim(),done:false});
    selDay=f.get("date");closeModal();save();toast(T("اتضاف ✓","Added ✓"))},
  pay(f){S.payments.push({id:uid(),clientId:f.get("clientId"),amount:+f.get("amount"),date:f.get("date")||today(),note:(f.get("note")||"").trim()});selMonth=(f.get("date")||today()).slice(0,7);closeModal();save();toast(T("الدفعة اتسجلت ✓","Payment saved ✓"))},
  program(f,id){
    const type=f.get("type"),sections=readSecs(type==="diet");
    const data={name:f.get("name").trim(),type,sections};
    if(id)Object.assign(P(id),data);else{id=uid();S.programs.push(Object.assign({id},data))}
    progType=data.type;save();viewProgram(id);toast(T("البرنامج اتحفظ ✓","Program saved ✓"))},
  profile(f){["name","title","phone","city","bio","services"].forEach(k=>S.profile[k]=(f.get(k)||"").toString().trim());if(!S.profile.name)S.profile.name=T("إيهاب","Ehab");closeModal();applyLang();save();toast(T("اتحفظ ✓","Saved ✓"))},
  restore(f){try{const o=JSON.parse(f.get("data"));if(!o||!Array.isArray(o.clients))throw 0;S=Object.assign(blank(),o);applyLang();closeModal();save();toast(T("البيانات رجعت ✓","Data restored ✓"))}catch(e){toast(T("النسخة دي مش سليمة","That backup isn't valid"))}}
};
function logW(id,w){const c=C(id),t=today();c.cu=Date.now();c.weights=(c.weights||[]).filter(x=>x.date!==t);c.weights.push({date:t,w:+w});save();toast(T("الوزن اتسجل ✓","Weight logged ✓"))}

document.addEventListener("click",e=>{
  if(e.target.id==="modal")return closeModal();
  const el=e.target.closest("[data-act]");if(!el||el.tagName==="A")return;
  e.preventDefault();e.stopPropagation();
  const fn=ACT[el.dataset.act];if(fn)fn(el.dataset.id,el);
});
document.addEventListener("submit",e=>{e.preventDefault();const f=e.target,fn=FORMS[f.dataset.form];if(fn)fn(new FormData(f),f.dataset.id||"")});
document.addEventListener("change",async e=>{const el=e.target;
  if(el.dataset.country!==undefined){const t=el.parentNode.querySelector("[name=country_t]");if(t){t.classList.toggle("hidden",el.value!=="__other");if(el.value==="__other")t.focus()}return}
  if(el.type==="radio"&&el.name==="gender"){const wd=document.querySelector("[data-women]");if(wd)wd.classList.toggle("hidden",el.value!=="f");return}
  if(el.type==="radio"&&el.name.startsWith("q_")){const m=document.querySelector(`[data-more="${el.name.slice(2)}"]`);if(m){m.classList.toggle("hidden",el.value!=="other");if(el.value==="other")m.querySelector("textarea").focus()}return}
  if(el.dataset.attach&&el.files&&el.files.length){const kind=el.dataset.attach;toast(T("بيجهّز الصور…","Preparing images…"));
    for(const file of [...el.files]){try{const id=await uploadImg(file,formC.id,kind);formFiles.push({id,kind,date:today()})}catch(err){toast(T("ما قدرتش أرفع الصورة","Couldn't upload the image"))}}
    refreshFiles(kind);toast(T("اتضاف ✓","Added ✓"));return}
  if(el.dataset.photo&&el.files&&el.files[0]){const k=el.dataset.photo,ctx=el.dataset.ctx;toast(T("بيرفع الصورة…","Uploading photo…"));
    let fid;try{fid=await uploadImg(el.files[0],ctx==="form"?formC.id:ctx,"photo-"+k)}catch(err){toast(T("ما قدرتش أرفع الصورة","Couldn't upload the photo"));return}
    if(ctx==="form"){formPhotos[k]=fid;formPhotos.date=today();refreshSlots("form",formPhotos)}
    else{const c=C(ctx);if(!c)return;const old=(c.photos||{})[k];c.photos=Object.assign({},c.photos||{},{[k]:fid,date:today()});if(old)delFile(old);c.cu=Date.now();save()}
    toast(T("الصورة اتضافت ✓","Photo added ✓"));return}
  if(el.dataset.change==="assign"){assignProg(el.dataset.id,el.dataset.key,el.value)}
  if(el.name==="type"&&el.closest("form[data-form=program]")){const fm=el.closest("form"),isDiet=el.value==="diet",secs=readSecs(isDiet);programForm({id:fm.dataset.id||undefined,owner:fm.dataset.owner||undefined,name:fm.querySelector("[name=name]").value,type:el.value,sections:secs.length?secs:[{title:"",lines:""}]})}
});
document.addEventListener("input",e=>{if(e.target.id==="search"){q=e.target.value.trim();$("#clist").innerHTML=clientList();return}
  const wk=e.target.dataset&&e.target.dataset.w;if(wk){const c=curClient();if(!c||!c.cur)return;const [i,j]=wk.split("-").map(Number);c.cur.w=c.cur.w||{};const a=(c.cur.w[i]||[]).slice();while(a.length<=j)a.push("");a[j]=e.target.value.trim();c.cur.w[i]=a;c.cu=Date.now();saveQuiet()}});
window.addEventListener("hashchange",()=>{tab=location.hash.slice(1)||"home";trainee=null;formC=null;closeModal();render();scrollTo(0,0)});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal()});
document.addEventListener("focusout",()=>setTimeout(()=>{const a=document.activeElement;if(deferR&&!(a&&a.matches&&a.matches("input,textarea,select"))){deferR=false;softRender()}},50));
applyLang();render();init();
</script>
</body>
